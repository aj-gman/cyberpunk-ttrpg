<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-man's Cyberpunk — Header</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff2e6d;
    --cyan:#26f2e6;
    --bg:#050507;
    --grid:rgba(38,242,230,0.05);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Chakra Petch',sans-serif;
    overflow:hidden;
  }
  .hero{
    position:relative;
    width:100%;
    max-width:1100px;
    padding:6rem 2rem;
    text-align:center;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:40px 40px;
  }
  .hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      radial-gradient(ellipse 60% 40% at 30% 20%, rgba(255,46,109,0.10), transparent 70%),
      radial-gradient(ellipse 60% 40% at 70% 80%, rgba(38,242,230,0.10), transparent 70%);
    pointer-events:none;
  }

  .kicker{
    font-family:'Rajdhani',sans-serif;
    font-weight:600;
    font-size:0.9rem;
    letter-spacing:0.35em;
    color:var(--cyan);
    margin:0 0 1.2rem;
    opacity:0.85;
  }

  .glitch-title{
    position:relative;
    font-family:'Rajdhani',sans-serif;
    font-weight:700;
    font-size:clamp(2.8rem, 8vw, 6rem);
    line-height:1;
    margin:0;
    letter-spacing:0.01em;
    color:#f2f2f5;
    text-transform:uppercase;
    -webkit-font-smoothing:antialiased;
  }
  .glitch-title .line2{
    display:block;
    font-size:0.55em;
    margin-top:0.15em;
    color:var(--pink);
  }

  .glitch-title::before,
  .glitch-title::after{
    content:attr(data-text);
    position:absolute;
    left:0;
    top:0;
    width:100%;
    overflow:hidden;
    background:var(--bg);
    clip-path:inset(0 0 0 0);
  }
  .glitch-title::before{
    color:var(--pink);
    transform:translate(3px,0);
    mix-blend-mode:screen;
    animation:glitchTop 2.5s infinite steps(1);
  }
  .glitch-title::after{
    color:var(--cyan);
    transform:translate(-3px,0);
    mix-blend-mode:screen;
    animation:glitchBottom 2.5s infinite steps(1);
  }

  @keyframes glitchTop{
    0%, 100% { clip-path:inset(0 0 0 0); transform:translate(0,0); }
    12% { clip-path:inset(0 0 0 0); transform:translate(0,0); }
    13% { clip-path:inset(8% 0 65% 0); transform:translate(5px,-3px); }
    14% { clip-path:inset(55% 0 10% 0); transform:translate(-6px,2px); }
    15% { clip-path:inset(25% 0 45% 0); transform:translate(4px,1px); }
    16% { clip-path:inset(0 0 0 0); transform:translate(0,0); }
    38% { clip-path:inset(0 0 0 0); transform:translate(0,0); }
    39% { clip-path:inset(40% 0 25% 0); transform:translate(-8px,2px); }
    40% { clip-path:inset(5% 0 70% 0); transform:translate(6px,-4px); }
    41% { clip-path:inset(60% 0 8% 0); transform:translate(-3px,3px); }
    42% { clip-path:inset(0 0 0 0); transform:translate(0,0); }
    62% { clip-path:inset(0 0 0 0); transform:translate(0,0); }
    63% { clip-path:inset(15% 0 50% 0); transform:translate(7px,-2px); }
    64% { clip-path:inset(70% 0 5% 0); transform:translate(-5px,4px); }
    65% { clip-path:inset(30% 0 35% 0); transform:translate(3px,-1px); }
    66% { clip-path:inset(0 0 0 0); transform:translate(0,0); }
    82% { clip-path:inset(0 0 0 0); transform:translate(0,0); }
    83% { clip-path:inset(50% 0 15% 0); transform:translate(-7px,3px); }
    84% { clip-path:inset(10% 0 60% 0); transform:translate(5px,-2px); }
    85% { clip-path:inset(75% 0 2% 0); transform:translate(-4px,1px); }
    86% { clip-path:inset(0 0 0 0); transform:translate(0,0); }
    93% { clip-path:inset(0 0 0 0); transform:translate(0,0); }
    94% { clip-path:inset(20% 0 40% 0); transform:translate(8px,-3px); }
    95% { clip-path:inset(65% 0 10% 0); transform:translate(-6px,2px); }
    96% { clip-path:inset(35% 0 30% 0); transform:translate(4px,-1px); }
    97% { clip-path:inset(0 0 0 0); transform:translate(0,0); }
  }
  @keyframes glitchBottom{
    0%, 100% { clip-path:inset(0 0 0 0); transform:translate(0,0); }
    11% { clip-path:inset(0 0 0 0); transform:translate(0,0); }
    12% { clip-path:inset(45% 0 20% 0); transform:translate(-5px,3px); }
    13% { clip-path:inset(5% 0 75% 0); transform:translate(6px,-2px); }
    14% { clip-path:inset(70% 0 5% 0); transform:translate(-4px,-3px); }
    15% { clip-path:inset(0 0 0 0); transform:translate(0,0); }
    37% { clip-path:inset(0 0 0 0); transform:translate(0,0); }
    38% { clip-path:inset(30% 0 35% 0); transform:translate(8px,-2px); }
    39% { clip-path:inset(60% 0 10% 0); transform:translate(-7px,4px); }
    40% { clip-path:inset(10% 0 55% 0); transform:translate(3px,-1px); }
    41% { clip-path:inset(0 0 0 0); transform:translate(0,0); }
    61% { clip-path:inset(0 0 0 0); transform:translate(0,0); }
    62% { clip-path:inset(55% 0 15% 0); transform:translate(-6px,2px); }
    63% { clip-path:inset(8% 0 68% 0); transform:translate(7px,-4px); }
    64% { clip-path:inset(72% 0 3% 0); transform:translate(-3px,1px); }
    65% { clip-path:inset(0 0 0 0); transform:translate(0,0); }
    81% { clip-path:inset(0 0 0 0); transform:translate(0,0); }
    82% { clip-path:inset(20% 0 45% 0); transform:translate(5px,-3px); }
    83% { clip-path:inset(65% 0 8% 0); transform:translate(-8px,2px); }
    84% { clip-path:inset(15% 0 50% 0); transform:translate(4px,-2px); }
    85% { clip-path:inset(0 0 0 0); transform:translate(0,0); }
    92% { clip-path:inset(0 0 0 0); transform:translate(0,0); }
    93% { clip-path:inset(40% 0 25% 0); transform:translate(-7px,3px); }
    94% { clip-path:inset(5% 0 72% 0); transform:translate(6px,-1px); }
    95% { clip-path:inset(58% 0 12% 0); transform:translate(-5px,4px); }
    96% { clip-path:inset(0 0 0 0); transform:translate(0,0); }
  }

  .glitch-title{
    animation:flicker 3s infinite;
  }
  @keyframes flicker{
    0%, 100% { text-shadow:
      0 0 8px rgba(255,46,109,0.35),
      0 0 18px rgba(38,242,230,0.20);
    }
    33% { text-shadow:
      0 0 8px rgba(255,46,109,0.35),
      0 0 18px rgba(38,242,230,0.20);
    }
    34% { text-shadow:none; }
    35% { text-shadow:
      0 0 8px rgba(255,46,109,0.35),
      0 0 18px rgba(38,242,230,0.20);
    }
    67% { text-shadow:
      0 0 8px rgba(255,46,109,0.35),
      0 0 18px rgba(38,242,230,0.20);
    }
    68% { text-shadow:none; }
    69% { text-shadow:none; }
    70% { text-shadow:
      0 0 10px rgba(255,46,109,0.50),
      0 0 24px rgba(38,242,230,0.35);
    }
  }

  .subhead{
    font-family:'Chakra Petch',sans-serif;
    font-weight:500;
    font-size:1.05rem;
    color:#a9adb8;
    max-width:520px;
    margin:2rem auto 0;
    line-height:1.6;
  }

  .nav-grid{
    margin-top:2.8rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1.8rem;
  }
  .nav-group{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0.7rem;
  }
  .nav-group-label{
    font-family:'Rajdhani',sans-serif;
    font-weight:600;
    font-size:0.75rem;
    letter-spacing:0.3em;
    color:rgba(255,255,255,0.45);
    text-transform:uppercase;
    margin:0;
  }
  .nav-group-buttons{
    display:flex;
    gap:0.9rem;
    flex-wrap:wrap;
    justify-content:center;
  }
  .cta{
    font-family:'Rajdhani',sans-serif;
    font-weight:600;
    letter-spacing:0.08em;
    font-size:0.95rem;
    text-transform:uppercase;
    padding:0.85rem 1.6rem;
    border:1px solid var(--cyan);
    color:var(--cyan);
    text-decoration:none;
    position:relative;
    transition:color 0.2s, background 0.2s;
    clip-path:polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
  }
  .cta:hover{
    color:var(--bg);
    background:var(--cyan);
  }
  .cta.alt{
    border-color:var(--pink);
    color:var(--pink);
  }
  .cta.alt:hover{
    background:var(--pink);
    color:var(--bg);
  }

  @media (prefers-reduced-motion: reduce){
    .glitch-title, .glitch-title::before, .glitch-title::after{
      animation:none;
    }
  }
</style>
</head>
<body>

<div class="hero">
  <p class="kicker">A DIGITAL GARDEN &middot; NIGHT CITY &amp; BEYOND</p>
  <h1 class="glitch-title" data-text="G-MAN'S">
    G-MAN'S
    <span class="line2" data-text="CYBERPUNK">CYBERPUNK</span>
  </h1>
  <p class="subhead">
    An archive of stories, rules, and lore gathered across TTRPG sessions — from the Eurotour to the streets of Night City.
  </p>
  <div class="nav-grid">
    <div class="nav-group">
      <p class="nav-group-label">Character Sheets</p>
      <div class="nav-group-buttons">
        <a class="cta" href="https://gman-cyberpunk.vercel.app/cpred-sheet/">CyberpunkRED</a>
        <a class="cta alt" href="https://gman-cyberpunk.vercel.app/nc-overdrive-sheet/">NCOverdrive</a>
      </div>
    </div>
    <div class="nav-group">
      <p class="nav-group-label">Rules</p>
      <div class="nav-group-buttons">
        <a class="cta" href="https://gman-cyberpunk.vercel.app/rules/cpred/cyberpunk-red-hub/">CyberpunkRED</a>
        <a class="cta alt" href="https://gman-cyberpunk.vercel.app/rules/nc-overdrive/neon-city-overdrive-hub/">NCOverdrive</a>
      </div>
    </div>
    <div class="nav-group">
      <p class="nav-group-label">Lore</p>
      <div class="nav-group-buttons">
        <a class="cta" href="https://gman-cyberpunk.vercel.app/eurotour/eurotour/">Eurotour</a>
        <a class="cta alt" href="https://gman-cyberpunk.vercel.app/night-city/locations/night-city/">Night City</a>
      </div>
    </div>
  </div>
</div>

</body>
</html>
